# herdr — terminal workspace manager for AI coding agents
# https://herdr.dev  •  config reference: `herdr config reset-keys` prints defaults
#
# Symlinked to ~/.config/herdr/config.toml by herdr/install.sh.
# Reload a running server after editing: `herdr server reload-config`
#
# Keybindings mirror our tmux setup (misc/tmux.conf.symlink) where it makes sense.
# Only actions that differ from herdr's built-in v2 defaults are set below.
#
# Full config/theme/integration/plugin tour & recommendations:
#   docs/reference/herdr-config-tour.md

# Skip the first-run onboarding flow.
onboarding = false

[keys]
# Prefix — tmux muscle memory is ctrl+a.
# Trade-off: ctrl+a shadows shell beginning-of-line in every pane and herdr has
# no send-prefix escape. If that bites, swap to the ergonomic modern default:
#   prefix = "ctrl+space"
prefix = "ctrl+a"

# Splits — tmux: | = side-by-side, - = stacked.
# (- / split_horizontal is already the herdr default; set explicitly for clarity.)
split_vertical   = "prefix+|"
split_horizontal = "prefix+minus"

# Reload config on prefix+r (tmux `bind r`); move resize-mode off r to make room.
reload_config = "prefix+r"
resize_mode   = "prefix+shift+r"

# Window keys — tmux binds capital H/J/K/L for windows; herdr's nearest is tabs.
new_tab       = "prefix+shift+j"   # tmux J = new-window
close_tab     = "prefix+shift+k"   # tmux K = kill-window
previous_tab  = "prefix+shift+h"   # tmux H = prev
next_tab      = "prefix+shift+l"   # tmux L = next

# Pane focus h/j/k/l already matches tmux (herdr default focus_pane_left/down/up/right
# = prefix+h/j/k/l), so it's intentionally left at the default.

# Seamless nav across nvim splits + herdr panes — vim-tmux-navigator style.
# Provided by the vendored `vim-herdr-navigation` plugin (plugins/vim-herdr-navigation/),
# linked by install.sh. Alt (not Ctrl) chords so we keep readline Ctrl+L/Ctrl+K in
# shells and the <C-h>/<C-l> jump aliases in nvim. Editor side: nvim/lua/herdr-nav.lua.
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui]
agent_panel_sort = "priority"

# Agent rows default to [state_icon, workspace, tab] + [agent], which labels every
# pane with its *space* name — useless when manager drops several unrelated jobs
# into one space. Lead with the pane's own terminal title instead.
# Note: a row whose tokens all resolve to None is dropped, so workspace stays on
# row 2 as the fallback identity when a pane sets no title.
# Row 2 is workspace only: `agent` is always "claude" here and `state_text` just
# repeats the state icon — three tokens in a ~30col sidebar truncated all of them.
[ui.sidebar.agents]
rows = [
  ["state_icon", "terminal_title_stripped"],
  [{ token = "workspace", dim = true }],
]
